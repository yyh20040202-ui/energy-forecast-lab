[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "energy-forecast-lab"
version = "0.1.0"
description = "Leakage-aware multi-step building energy forecasting with PyTorch"
requires-python = ">=3.10,<3.13"

[tool.setuptools.packages.find]
include = ["energy_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
